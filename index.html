<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Made by Deb — fine art prints by Debbie Burkhoff."
    />
    <title>Made by Deb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="stylesheet" href="styles.css?v=20261103" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="site-header">
      <div class="site-header-inner">
        <div class="brand-lockup">
          <img src="images/mark.png" alt="" width="52" height="52" />
          <div class="brand-text">
            <h1>Made by Deb</h1>
            <p>Fine art prints</p>
          </div>
        </div>
        <nav class="site-nav" aria-label="Contact">
          <a href="mailto:hello@madebydeb.art">Email</a>
          <a
            href="https://www.instagram.com/made_by_deb/"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          >
        </nav>
      </div>
    </header>

    <section class="prints" id="prints" aria-label="Prints">
      <div class="prints-inner">
        <ul class="print-grid" id="print-grid"></ul>
      </div>
    </section>

    <footer class="site-footer">
      <p class="footer-brand">Made by Deb</p>
      <div class="footer-links">
        <a href="mailto:hello@madebydeb.art">hello@madebydeb.art</a>
        <a
          href="https://www.instagram.com/made_by_deb/"
          target="_blank"
          rel="noopener noreferrer"
          >@made_by_deb</a
        >
      </div>
    </footer>

    <div
      class="lightbox"
      id="lightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Print viewer"
    >
      <button class="lightbox-close" type="button" aria-label="Close viewer">
        Close
      </button>
      <button class="lightbox-nav prev" type="button" aria-label="Previous print">
        ‹
      </button>
      <button class="lightbox-nav next" type="button" aria-label="Next print">
        ›
      </button>
      <div class="lightbox-stage">
        <div class="lightbox-track" id="lightbox-track"></div>
      </div>
      <div class="lightbox-meta">
        <p class="lightbox-title" id="lightbox-title"></p>
        <p class="lightbox-sizes" id="lightbox-sizes"></p>
        <a class="lightbox-inquire" id="lightbox-inquire" href="mailto:hello@madebydeb.art"
          >Send me an email</a
        >
      </div>
    </div>

    <script src="works.js?v=20261009"></script>
    <script src="script.js?v=20261008c"></script>
  </body>
</html>
