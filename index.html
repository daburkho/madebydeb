<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Made by Deb — fine art prints by Debbie Burkhoff."
    />
    <title>Made by Deb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>

    <header class="hero">
      <div class="hero-copy">
        <p class="brand">Made by Deb</p>
        <h1>Fine art prints</h1>
        <p class="lede">
          Original work, available as limited prints. Inquire for sizes and
          availability.
        </p>
        <div class="actions">
          <a class="button" href="mailto:hello@madebydeb.art">Email</a>
          <a
            class="text-link"
            href="https://www.instagram.com/made_by_deb/"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          >
        </div>
      </div>
      <a class="scroll-cue" href="#prints">View prints</a>
    </header>

    <section class="prints" id="prints" aria-labelledby="prints-heading">
      <div class="section-head">
        <h2 id="prints-heading">Prints</h2>
        <p>Select a work to view details and available sizes.</p>
      </div>
      <ul class="print-grid" id="print-grid"></ul>
    </section>

    <footer class="site-footer">
      <p class="footer-brand">Made by Deb</p>
      <div class="footer-links">
        <a href="mailto:hello@madebydeb.art">hello@madebydeb.art</a>
        <a
          href="https://www.instagram.com/made_by_deb/"
          target="_blank"
          rel="noopener noreferrer"
          >@made_by_deb</a
        >
      </div>
    </footer>

    <div
      class="lightbox"
      id="lightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Print viewer"
    >
      <button class="lightbox-close" type="button" aria-label="Close viewer">
        Close
      </button>
      <button class="lightbox-nav prev" type="button" aria-label="Previous print">
        ‹
      </button>
      <button class="lightbox-nav next" type="button" aria-label="Next print">
        ›
      </button>
      <div class="lightbox-stage">
        <div class="lightbox-track" id="lightbox-track"></div>
      </div>
      <div class="lightbox-meta">
        <p class="lightbox-title" id="lightbox-title"></p>
        <p class="lightbox-sizes" id="lightbox-sizes"></p>
        <a class="lightbox-inquire" id="lightbox-inquire" href="mailto:hello@madebydeb.art"
          >Inquire</a
        >
      </div>
    </div>

    <script src="works.js"></script>
    <script src="script.js"></script>
  </body>
</html>
